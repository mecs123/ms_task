# Gradle
# Pipeline básico para compilar un proyecto Java con Gradle
# usando un agente auto-hospedado en Windows (sin ejecutar tests)

trigger:
  - main

pool:
  name: 'Default'                         # Usa tu pool local
  demands:
    - agent.name -equals custonAgentTask  # Nombre exacto de tu agente local

steps:
  # Paso 1: Mostrar versión de Java
  - script: |
      echo "Verificando versión de Java..."
      java --version
    displayName: 'Verificar entorno Java'

  # Paso 2: Compilar proyecto con Gradle (sin tests)
  - task: Gradle@2
    displayName: 'Compilar proyecto con Gradle (sin tests)'
    inputs:
      workingDirectory: '$(System.DefaultWorkingDirectory)/task001'
      gradleWrapperFile: '$(System.DefaultWorkingDirectory)/task001/gradlew.bat'
      tasks: 'clean assemble'
      options: '--info --stacktrace -Xmx3072m'
      publishJUnitResults: false
      javaHomeOption: 'Path'
      jdkDirectory: 'C:\Program Files\Java\jdk-21'
      jdkArchitectureOption: 'x64'
    continueOnError: false   # cambia a true solo si quieres que ignore fallos falsos

  # Paso 3: Publicar artefacto .jar generado
  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto .jar'
    inputs:
      PathtoPublish: '$(System.DefaultWorkingDirectory)/task001/build/libs'
      ArtifactName: 'drop'
      publishLocation: 'Container'