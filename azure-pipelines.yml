# Gradle
# Pipeline básico para compilar un proyecto Java con Gradle
# usando un agente auto-hospedado en Windows (sin ejecutar tests)

trigger:
  - main

pool:
  name: 'Default'                         # Usa tu pool local
  demands:
    - agent.name -equals custonAgentTask  # Nombre exacto de tu agente local

steps:
  # Paso 1: Mostrar versión de Java (opcional pero útil)
  - script: |
      echo "Verificando versión de Java..."
      java --version
    displayName: 'Verificar entorno Java'

  # Paso 2: Compilar proyecto con Gradle (sin tests)
  - task: Gradle@3
    displayName: 'Compilar proyecto con Gradle (sin tests)'
    inputs:
      gradleWrapperFile: 'gradlew'
      tasks: 'clean assemble'              # 👈 solo compila, sin ejecutar tests
      options: '-Xmx3072m'                 # un poco más de memoria por estabilidad
      javaHomeOption: 'Path'
      jdkDirectory: 'C:\Program Files\Java\jdk-21'
      jdkArchitectureOption: 'x64'

  # Paso 3: Publicar artefacto .jar generado
  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto .jar'
    inputs:
      PathtoPublish: 'build/libs'
      ArtifactName: 'drop'
      publishLocation: 'Container'