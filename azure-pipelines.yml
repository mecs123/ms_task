# Gradle
# Pipeline para compilar y ejecutar tests en un proyecto Java con Gradle
# usando un agente auto-hospedado en Windows

trigger:
  - main

pool:
  name: 'Default'                         # Usa tu pool local
  demands:
    - agent.name -equals custonAgentTask  # Nombre exacto de tu agente local

steps:
  # Paso 1: Mostrar versión de Java (opcional pero útil)
  - script: |
      echo "Verificando versión de Java..."
      java --version
    displayName: 'Verificar entorno Java'

  # Paso 2: Compilar y ejecutar tests con Gradle
  - task: Gradle@3
    displayName: 'Compilar y ejecutar tests con Gradle'
    inputs:
      gradleWrapperFile: 'gradlew'
      tasks: 'clean test assemble'               # Ejecuta limpieza, pruebas y compilación
      options: '-Xmx2048m'                       # Reduce el uso de memoria
      javaHomeOption: 'Path'
      jdkDirectory: 'C:\Program Files\Java\jdk-21'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: true                  # Publica resultados JUnit
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'  # Ruta correcta de los XML

  # Paso 3: Publicar artefacto .jar generado
  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto .jar'
    inputs:
      PathtoPublish: 'build/libs'
      ArtifactName: 'drop'
      publishLocation: 'Container'