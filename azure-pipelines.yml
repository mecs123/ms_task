trigger:
  branches:
    include:
      - main
      - development/*
      - feature/*
  paths:
    include:
      - 'repo_task*'

pool:
  name: 'Default'
  demands:
    - agent.name -equals custonAgentTask

steps:
  # Paso 1: Verificar entorno Java
  - script: |
      echo "Verificando versión de Java..."
      java --version
    displayName: 'Verificar entorno Java'

  # Paso 2: Compilar siempre (todas las ramas)
  - task: Gradle@3
    displayName: 'Compilar proyecto con Gradle (sin tests)'
    inputs:
      workingDirectory: '.'
      gradleWrapperFile: 'gradlew'
      tasks: 'clean assemble'
      javaHomeOption: 'Path'
      jdkDirectory: 'C:\Program Files\Java\jdk-21'
      sqGradlePluginVersionChoice: 'build'
      jdkArchitectureOption: 'x64'