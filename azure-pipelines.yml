trigger:
  branches:
    include:
      - main
      - development/*
      - feature/*
  paths:
    include:
      - 'repo_task*'

pool:
  name: 'Default'
  demands:
    - agent.name -equals custonAgentTask

variables:
- group: 'Dev'

- name: JAVA_HOME
  value: 'C:\Program Files\Java\jdk-21'

- name: BUILD_DIR
  value: 'build'

- name: BUILD_CONFIGURATION
  value: 'release'

- name: ARTIFACT_NAME
  value: 'app-build'

- name: GRADLE_TASKS_BUILD
  value: 'clean assemble'

- name: GRADLE_TASKS_TEST
  value: 'test'

- name: GRADLE_TASKS_PUBLISH
  value: 'publish'

- name: RUN_TESTS
  value: true

steps:

  # Paso 1: Verificar entorno Java
  - script: |
      echo "Verificando versión de Java..."
      java --version
      echo "JAVA_HOME: $(JAVA_HOME)"
    displayName: 'Verificar entorno Java'

  # Paso 2: Restaurar dependencias (Gradle)
  - task: Gradle@3
    displayName: 'Restaurar dependencias con Gradle'
    inputs:
      gradleWrapperFile: 'gradlew'
      workingDirectory: '.'
      tasks: 'dependencies'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME)'

  # Paso 3: Compilar proyecto
  - task: Gradle@3
    displayName: 'Compilar proyecto con Gradle'
    inputs:
      gradleWrapperFile: 'gradlew'
      workingDirectory: '.'
      tasks: '$(GRADLE_TASKS_BUILD)'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME)'

  # Paso 4: Ejecutar tests
  - task: Gradle@3
    displayName: 'Ejecutar pruebas unitarias'
    condition: eq(variables['RUN_TESTS'], 'true')
    inputs:
      gradleWrapperFile: 'gradlew'
      workingDirectory: '.'
      tasks: '$(GRADLE_TASKS_TEST)'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME)'

  # Paso opcional: Verificar conexión a PostgreSQL
  - script: |
      echo Verificando conexión con la base de datos...
      set PGPASSWORD=$(PGPASSWORD)
      psql -h $(PGHOST) -U $(PGUSER) -d $(PGDATABASE) -p $(PGPORT) -c "\conninfo"
    displayName: 'Verificar conexión a PostgreSQL'
    env:
      PGPASSWORD: $(PGPASSWORD)


  # Paso 5: Copiar artefactos al staging directory
  - task: CopyFiles@2
    displayName: 'Copiar artefactos al staging directory'
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)/build/libs'
      Contents: '**/*.jar'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'

  # Paso 6: Publicar artefacto compilado
  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto compilado'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: '$(ARTIFACT_NAME)'
      publishLocation: 'Container'
    condition: succeededOrFailed()

