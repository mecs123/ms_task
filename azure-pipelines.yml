# Gradle
# Pipeline básico para compilar un proyecto Java con Gradle
# usando un agente auto-hospedado en Windows (sin ejecutar tests)

trigger:
  branches:
    include:
      - main
      - development/*
      - feature/*
  paths:
    include:
      - 'repo_task*'

pool:
  name: 'Default'                         # Usa tu pool local
  demands:
    - agent.name -equals custonAgentTask  # Nombre exacto de tu agente local

steps:
  # Paso 1: Mostrar versión de Java (opcional pero útil)
  - script: |
      echo "Verificando versión de Java..."
      java --version
    displayName: 'Verificar entorno Java'

  # Paso 2: Compilar proyecto sin ejecutar tests
  - task: Gradle@3
    displayName: 'Compilar proyecto con Gradle (sin tests)'
    inputs:
      workingDirectory: '$(componentName)'
      gradleWrapperFile: '$(componentName)/gradlew'
      tasks: 'clean assemble'                # Solo compila, no corre tests
      javaHomeOption: 'Path'
      jdkDirectory: 'C:\Program Files\Java\jdk-21'
      sqGradlePluginVersionChoice: 'build'
      jdkArchitectureOption: 'x64'